[pytest]
# Every test is capped so a genuine hang FAILS LOUD in CI instead of stalling silently
# (the symptom an external audit hit: async/threaded tests "PASSED" but the process would
# not exit). The root fix is io_helpers.to_daemon_thread — provider work runs on DAEMON
# threads that can't gate interpreter exit — and this timeout is the safety net on top.
timeout = 30

# pytest-asyncio: tests opt in per-function via @pytest.mark.asyncio (strict mode), and
# fixtures default to function-scoped event loops (silences the unset-scope deprecation).
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function
