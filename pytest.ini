[pytest]
# Every test is capped so a genuine hang fails loudly in CI instead of stalling silently:
# async/threaded tests can report PASSED while a stuck non-daemon thread keeps the process
# from exiting. io_helpers.to_daemon_thread prevents that at the source; this timeout is
# the safety net on top.
timeout = 30

# pytest-asyncio: tests opt in per-function via @pytest.mark.asyncio (strict mode), and
# fixtures default to function-scoped event loops (silences the unset-scope deprecation).
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function
