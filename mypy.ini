[mypy]
# Target the backend package directory.
# Run as: mypy io.github.dlansama.tallybar/contents/code/
python_version = 3.11

# mypy is run from inside the applet dir (see the Makefile), so the default
# ./.mypy_cache would land in io.github.dlansama.tallybar/contents/code/ and get tarred
# into the shipped .plasmoid. Park it at the repo root instead.
cache_dir = ../../../.mypy_cache

# Lenient baseline — backend uses star-imports and dynamic patterns that are
# hard to type strictly without rewriting; we want useful signal not noise.
ignore_missing_imports = True
follow_imports = silent
warn_unused_ignores = False
warn_return_any = False
disallow_untyped_defs = False
disallow_incomplete_defs = False
check_untyped_defs = True

# gi (PyGObject) and psutil ship no stubs; suppress the import-untyped noise.
[mypy-gi.*]
ignore_missing_imports = True

[mypy-psutil.*]
ignore_missing_imports = True
