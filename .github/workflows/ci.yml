name: CI

# Gate every PR and every push to main with the same flake8 + tests the release
# workflow runs — so a broken change is caught before merge, not only at release time.
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to immutable commit SHAs (supply-chain hardening): a mutable
      # @v4/@v5 tag can be moved by an upstream compromise to run arbitrary code in
      # CI. Bump the comment + SHA together to update. Mirrors release-plasmoid.yml.
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Static analysis (pyflakes via flake8)
        run: |
          flake8 --select=F io.github.dlansama.tallybar/contents/code/ tests/ integrations/

      - name: QML static analysis (qmllint)
        run: |
          # No `|| true`: if the linter can't be installed the gate must fail, not skip.
          # The Makefile resolves the off-PATH Qt6 binary (/usr/lib/qt6/bin/qmllint).
          sudo apt-get update && sudo apt-get install -y qt6-declarative-dev-tools
          # syntax mode: Ubuntu has no Plasma 6 QML modules, so semantic lint is local-only.
          make qmllint QMLLINT_MODE=syntax

      - name: Type-check (mypy)
        run: |
          # Strict since the tree was made type-clean; `make check` blocks on this
          # locally too. Uses the Makefile target so CI and local runs can't drift.
          make typecheck

      - name: Run tests
        run: |
          pytest tests/
