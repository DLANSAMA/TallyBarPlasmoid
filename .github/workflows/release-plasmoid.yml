name: Release Plasmoid

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to immutable commit SHAs (supply-chain hardening) — matches the
      # softprops pin below and ci.yml. A mutable @v4/@v5 tag could be moved by an
      # upstream compromise to run arbitrary code with our contents:write token.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Static analysis (pyflakes via flake8)
        run: |
          # --select=F runs only pyflakes' logical checks (unused imports F401,
          # undefined names F821, redefinitions F811, ...) — catches real defects
          # and the no-dead-imports rule without style churn.
          flake8 --select=F io.github.dlansama.tallybar/contents/code/ tests/ integrations/

      - name: QML static analysis (qmllint)
        run: |
          # No `|| true`: if the linter can't be installed the gate must fail, not skip.
          # The Makefile resolves the off-PATH Qt6 binary (/usr/lib/qt6/bin/qmllint).
          sudo apt-get update && sudo apt-get install -y qt6-declarative-dev-tools
          # syntax mode: Ubuntu has no Plasma 6 QML modules, so semantic lint is local-only.
          make qmllint QMLLINT_MODE=syntax

      - name: Type-check (mypy)
        run: |
          # `make check` blocks on this locally too. Uses the Makefile target so CI and
          # local runs can't drift.
          make typecheck

      - name: Run tests
        run: |
          pytest tests/

      - name: Sync version from tag into metadata.json
        run: |
          # The release is triggered by a v* tag; keep KPlugin.Version in lockstep
          # so the shipped plasmoid reports the released version (not a stale literal).
          VERSION="${GITHUB_REF_NAME#v}"
          jq --arg v "$VERSION" '.KPlugin.Version = $v' io.github.dlansama.tallybar/metadata.json > metadata.json.tmp
          mv metadata.json.tmp io.github.dlansama.tallybar/metadata.json
          echo "metadata.json Version set to $VERSION"

      - name: Build Plasmoid and checksums
        run: |
          make build
          sha256sum io.github.dlansama.tallybar.plasmoid > SHA256SUMS
          cat SHA256SUMS

      - name: Extract release notes from CHANGELOG.md
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python3 - "$VERSION" <<'PY'
          import re, sys
          from pathlib import Path

          version = sys.argv[1]
          text = Path("CHANGELOG.md").read_text(encoding="utf-8")
          pattern = re.compile(
              r"^## \[" + re.escape(version) + r"\][^\n]*\n(.*?)(?=^## \[|^\[|\Z)",
              re.M | re.S,
          )
          m = pattern.search(text)
          body = m.group(1).strip() if m else ""
          if body:
              Path("release_notes.md").write_text(body + "\n", encoding="utf-8")
          PY
          if [ -s release_notes.md ]; then
            echo "has_notes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_notes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Release
        # Pinned to an immutable commit SHA (supply-chain hardening): a mutable @v1/@v2
        # tag could be moved by an upstream compromise to run arbitrary code with our
        # contents:write GITHUB_TOKEN. Bump the comment + SHA together to update.
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            io.github.dlansama.tallybar.plasmoid
            SHA256SUMS
          body_path: ${{ steps.notes.outputs.has_notes == 'true' && 'release_notes.md' || '' }}
          generate_release_notes: ${{ steps.notes.outputs.has_notes != 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
