name: Release Plasmoid

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to immutable commit SHAs (supply-chain hardening) — matches the
      # softprops pin below and ci.yml. A mutable @v4/@v5 tag could be moved by an
      # upstream compromise to run arbitrary code with our contents:write token.
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Static analysis (pyflakes via flake8)
        run: |
          # --select=F runs only pyflakes' logical checks (unused imports F401,
          # undefined names F821, redefinitions F811, ...) — catches real defects
          # and the no-dead-imports rule without style churn.
          flake8 --select=F io.github.dlansama.tallybar/contents/code/ tests/ integrations/

      - name: QML static analysis (qmllint)
        run: |
          # No `|| true`: if the linter can't be installed the gate must fail, not skip.
          # The Makefile resolves the off-PATH Qt6 binary (/usr/lib/qt6/bin/qmllint).
          sudo apt-get update && sudo apt-get install -y qt6-declarative-dev-tools
          # syntax mode: Ubuntu has no Plasma 6 QML modules, so semantic lint is local-only.
          make qmllint QMLLINT_MODE=syntax

      - name: Type-check (mypy)
        run: |
          # Strict since the tree was made type-clean; `make check` blocks on this
          # locally too. Uses the Makefile target so CI and local runs can't drift.
          make typecheck

      - name: Run tests
        run: |
          pytest tests/

      - name: Sync version from tag into metadata.json
        run: |
          # The release is triggered by a v* tag; keep KPlugin.Version in lockstep
          # so the shipped plasmoid reports the released version (not a stale literal).
          VERSION="${GITHUB_REF_NAME#v}"
          jq --arg v "$VERSION" '.KPlugin.Version = $v' io.github.dlansama.tallybar/metadata.json > metadata.json.tmp
          mv metadata.json.tmp io.github.dlansama.tallybar/metadata.json
          echo "metadata.json Version set to $VERSION"

      - name: Build Plasmoid
        run: |
          make build

      - name: Create Release
        # Pinned to an immutable commit SHA (supply-chain hardening): a mutable @v1/@v2
        # tag could be moved by an upstream compromise to run arbitrary code with our
        # contents:write GITHUB_TOKEN. Bump the comment + SHA together to update.
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: io.github.dlansama.tallybar.plasmoid
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
